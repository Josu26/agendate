<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario - AgenDate</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background-color: #f0f0f0;
            height: 90%;
            overflow: hidden;
        }

        .content-container {
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align items at the top */
            height: 73vh;
            padding: 10px;
            box-sizing: border-box;
        }

        .calendar-container {
            width: 100%;
            max-width: 650px; /* Further reduced max width */
            height: 350px; /* Further reduced height */
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
            margin-top: 10px;
        }

        .calendar header {
            background-color: #007bff;
            color: #fff;
            padding: 10px; /* Further reduced padding */
            text-align: center;
            border-radius: 10px 10px 0 0;
        }

        .calendar table {
            width: 100%;
            border-collapse: collapse;
            flex: 1;
        }

        .calendar th, .calendar td {
            padding: 5px; /* Further reduced padding */
            text-align: center;
        }

        .calendar th {
            background-color: #007bff;
            color: #fff;
        }

        .calendar td {
            background-color: #e9ecef;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        .calendar td:hover {
            background-color: #ddd;
        }

        .calendar .today {
            background-color: #ffeb3b;
        }

        .navigation-buttons {
            text-align: center;
            margin: 10px 0; /* Further reduced margin */
        }

        .navigation-buttons button {
            margin: 0 5px;
            padding: 5px 10px; /* Further reduced padding */
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        .navigation-buttons button:hover {
            background-color: #0056b3;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            border-radius: 10px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover, .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="content-container">
        <div class="calendar-container">
            <header>
                <h1 id="calendar-title">Junio 2024</h1>
            </header>
            <table id="calendar-table">
                <thead>
                    <tr>
                        <th>Lun</th>
                        <th>Mar</th>
                        <th>Mié</th>
                        <th>Jue</th>
                        <th>Vie</th>
                        <th>Sáb</th>
                        <th>Dom</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Días del mes se insertarán aquí -->
                </tbody>
            </table>
            <div class="navigation-buttons">
                <button id="prevMonth">Mes Anterior</button>
                <button id="nextMonth">Mes Siguiente</button>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Citas del Día</h2>
            <div id="day-appointments">
                <!-- Las citas del día se mostrarán aquí -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const calendarTitle = document.getElementById('calendar-title');
            const calendarTable = document.getElementById('calendar-table').getElementsByTagName('tbody')[0];
            let currentMonth = new Date().getMonth();
            let currentYear = new Date().getFullYear();

            function updateCalendar() {
                calendarTable.innerHTML = '';
                const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
                calendarTitle.textContent = `${monthNames[currentMonth]} ${currentYear}`;

                const firstDay = new Date(currentYear, currentMonth, 1);
                const lastDay = new Date(currentYear, currentMonth + 1, 0);

                const daysInWeek = 7;
                let date = new Date(firstDay);
                date.setDate(date.getDate() - date.getDay());

                while (date <= lastDay || date.getDay() !== 0) {
                    const row = document.createElement('tr');
                    for (let i = 0; i < daysInWeek; i++) {
                        const cell = document.createElement('td');
                        if (date.getMonth() === currentMonth) {
                            cell.textContent = date.getDate();
                            cell.addEventListener('click', () => showDayAppointments(date));
                            if (date.toDateString() === new Date().toDateString()) {
                                cell.classList.add('today');
                            }
                        }
                        row.appendChild(cell);
                        date.setDate(date.getDate() + 1);
                    }
                    calendarTable.appendChild(row);
                }
            }

            document.getElementById('prevMonth').addEventListener('click', function() {
                if (currentMonth === 0) {
                    currentMonth = 11;
                    currentYear--;
                } else {
                    currentMonth--;
                }
                updateCalendar();
            });

            document.getElementById('nextMonth').addEventListener('click', function() {
                if (currentMonth === 11) {
                    currentMonth = 0;
                    currentYear++;
                } else {
                    currentMonth++;
                }
                updateCalendar();
            });

            const modal = document.getElementById('modal');
            const span = document.getElementsByClassName('close')[0];

            function showDayAppointments(date) {
                const dayAppointments = document.getElementById('day-appointments');
                dayAppointments.innerHTML = `<p>Citas del día ${date.toLocaleDateString()}</p>`;
                modal.style.display = 'block';
            }

            span.onclick = function() {
                modal.style.display = 'none';
            }

            window.onclick = function(event) {
                if (event.target == modal) {
                    modal.style.display = 'none';
                }
            }

            updateCalendar();
        });
    </script>
</body>
</html>
